<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty-select">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
    <button id="theme-toggle" aria-label="Toggle dark mode">Dark Mode</button>
    <span id="timer">Time: 00:00</span>
    <span id="hints-used">Hints: 0</span>
    <span id="message"></span>
    <div id="save-score-section" style="display: none; margin-top: 12px;">
      <label for="player-name">Name:</label>
      <input type="text" id="player-name" placeholder="Enter your name" />
      <button id="save-score" disabled>Save Score</button>
    </div>
  </div>
  <section id="leaderboard-section">
    <h2>Top 10 Fastest Times</h2>
    <table id="leaderboard-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Time</th>
          <th>Difficulty</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
